[project]
name = "agent-kernel"
version = "0.1.0"
description = "微内核 + 插件端口的通用 agent 框架（内核零第三方依赖）"
requires-python = ">=3.11"
dependencies = []
authors = [{ name = "agent-kernel maintainers" }]
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.urls]
Repository = "https://github.com/either-f/scaffold-agent"

[project.scripts]
agent-kernel = "agent_kernel.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=4,<7",
    "ruff>=0.6,<1",
    "pyright>=1.1,<2",
    "httpx>=0.27,<1",
]

[project.optional-dependencies]
model = ["litellm>=1.93,<2"]
mcp = ["mcp>=1.28,<2", "mcp-server-fetch==2026.7.10"]
langchain = ["langchain-core>=1.4,<2"]
memory = ["psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1"]
graph = ["neo4j>=5.26,<6"]
milvus = ["pymilvus[milvus_lite]>=2.4,<3"]
keyword = ["elasticsearch>=8,<9"]
rerank = ["flashrank>=0.2,<1"]
obs = ["opentelemetry-sdk", "langfuse"]
langgraph = ["langgraph>=0.6,<0.7"]
mem0 = ["mem0ai>=2.0,<3", "chromadb>=0.5,<2"]
daytona = ["daytona>=0.203,<1"]
agentscope = ["agentscope>=2.0,<3"]
mlflow = ["mlflow>=3.0,<4"]
scrapers = ["requests>=2,<3", "beautifulsoup4>=4,<5"]
api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "apscheduler>=3.10,<4", "pyjwt>=2.8,<3", "bcrypt>=4.0,<5"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 130
target-version = "py311"
extend-exclude = ["examples/demo_files.py"]

[tool.ruff.lint]
# 宽松起步：只开 pyflakes (F) 和 pycodestyle 选中规则，不与既有代码风格打架。
select = ["F", "E9", "E7", "W"]
# 既有代码里大量裸 except / 未用 import 在 adapter 里是故意的，忽略以免 CI 红屏。
# F541: examples 里存在无占位符的 f-string（预存问题，配置通过而非改源码）。
ignore = ["E402", "F401", "F841", "F541"]

[tool.ruff.lint.per-file-ignores]
# 适配器/规划器里用裸 except、动态属性等；evals/tests 有 sys.path.insert 等约定。
"src/agent_kernel/adapters/*.py" = ["E722"]
"src/agent_kernel/planners/*.py" = ["E722"]
"evals/*.py" = ["E722"]

[tool.pyright]
include = ["src"]
# 适配器层大量 Any/动态 import，不强行加类型注解；只做存在性/语法级别的基线检查。
typeCheckingMode = "off"
reportMissingImports = "none"
reportMissingModuleSource = "none"
pythonVersion = "3.11"
