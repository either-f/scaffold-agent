name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tests/test_smoke.py
      - run: python evals/run_eval.py --mode offline
      - run: python -m compileall -q src examples evals
