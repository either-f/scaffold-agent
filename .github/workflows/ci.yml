name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  platform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ".[api,scrapers]" "pytest>=8,<9" "httpx>=0.27,<1"
      - name: Verify platform dependencies are present
        run: python -c "import fastapi, httpx, bcrypt, jwt, requests, bs4, apscheduler"
      - run: python -m pytest tests/test_api.py tests/test_auth.py tests/test_platform_api.py tests/test_platform_collectors.py tests/test_scrapers_ai_daily_news.py tests/test_scrapers_ghfind.py tests/test_scrapers_job_hunter.py -q -rs
      - run: python evals/check_core_imports.py
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - run: python -m pytest tests/ -q
      - run: python evals/run_eval.py --mode offline
      - run: python evals/run_m3.py context
      - run: python evals/run_m5.py
      - run: python evals/run_composite_memory.py
      - run: python evals/run_preferences.py
      - run: python evals/run_consolidation.py --mode offline
      - run: python evals/run_effects.py
      - run: python evals/run_event_sourcing.py
      - run: python evals/run_fork.py
      - run: pip install opentelemetry-sdk
      - run: python evals/run_observability_real.py
      - run: pip install "langgraph>=0.6,<0.7"
      - run: python evals/run_langgraph_real.py
      - run: python examples/record_demos.py --check
      - run: python -m compileall -q src examples evals
      - name: "kernel: no third-party imports"
        run: python evals/check_core_imports.py
