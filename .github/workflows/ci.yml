name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python tests/test_smoke.py
      - run: python tests/test_m4.py
      - run: python tests/test_m5.py
      - run: python tests/test_m6.py
      - run: python evals/run_eval.py --mode offline
      - run: python evals/run_m3.py context
      - run: python evals/run_m5.py
      - run: python examples/record_demos.py --check
      - run: python -m compileall -q src examples evals tests
      - name: "kernel: no third-party imports"
        run: >
          python -c "
          import ast,sys,pathlib;root=pathlib.Path('src/agent_kernel');fail=0
          for f in root.rglob('*.py'):
            if 'adapters' in str(f) or 'planners' in str(f): continue
            tree=ast.parse(f.read_text())
            for n in ast.walk(tree):
              if isinstance(n,(ast.Import,ast.ImportFrom)) and n.module:
                mod=n.module.split('.')[0]
                if mod not in {'_future_','__future__','abc','ast','base64','collections','contextlib','copy','dataclasses','datetime','decimal','enum','fractions','functools','hashlib','html','http','importlib','inspect','io','itertools','json','logging','math','operator','os','pathlib','platform','pprint','queue','random','re','shutil','signal','socket','sqlite3','statistics','string','struct','subprocess','sys','tempfile','textwrap','threading','time','traceback','typing','unittest','urllib','uuid','warnings','weakref','xml','zipfile'}:
                  print(f'THIRD-PARTY IMPORT: {f} imports {n.module}',file=sys.stderr);fail+=1
          sys.exit(min(fail,1))
          "
